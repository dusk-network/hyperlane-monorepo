# Fork CI only (never upstreamed): builds that upstream's PR CI does not cover.
name: fork-dev-tooling

on:
  push:
    branches: ['ci/npm-*', 'ci/widgets-*']

permissions:
  contents: read

jobs:
  widgets-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: pnpm-build
        uses: ./.github/actions/pnpm-build-with-cache
      - name: widgets storybook build
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1
        run: pnpm -C typescript/widgets exec storybook build --output-dir "$RUNNER_TEMP/storybook-static"

  warp-widget-example:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: typescript/warp-widget/examples/react-app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: typescript/warp-widget/examples/react-app/package.json
      - name: frozen install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm exec tsc --noEmit -p .
      - name: build
        run: pnpm build
