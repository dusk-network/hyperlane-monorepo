[package]
name = "hyperlane-dusk-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# A workspace of its own: the targets build with sanitizers and keep their own
# lock, started from rust/main's so the crate's dependencies match.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
hyperlane-dusk = { path = "..", features = ["fuzzing"] }

# rust/main's patches, which the crate's dependencies are built with.
[patch.crates-io.curve25519-dalek]
branch = "v3.2.2-relax-zeroize"
git = "https://github.com/Eclipse-Laboratories-Inc/curve25519-dalek"
version = "3.2.2"

[patch.crates-io.primitive-types]
branch = "hyperlane"
git = "https://github.com/hyperlane-xyz/parity-common.git"
version = "=0.12.1"

[patch.crates-io.rlp]
branch = "hyperlane"
git = "https://github.com/hyperlane-xyz/parity-common.git"
version = "=0.5.2"

[profile.release]
debug = 1

[[bin]]
name = "prepared_line"
path = "fuzz_targets/prepared_line.rs"
test = false
doc = false
bench = false

